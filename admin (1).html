<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secondeo Admin V7</title><style>body{font:15px Arial;background:#f4f7f5;padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fff;padding:20px;border-radius:14px;border:1px solid #ddd}.n{font-size:28px;font-weight:bold}</style></head><body><h1>👑 Secondeo Market — Administration V7</h1><div id="app">Chargement...</div><script>
let t=localStorage.token;async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:"Bearer "+t,"Content-Type":"application/json"};let r=await fetch(p,o);return r.json()}async function go(){let s=await api("/api/admin/stats");document.querySelector("#app").innerHTML=`<div class="grid">${Object.entries(s).map(([k,v])=>`<div class="card">${k}<div class="n">${k==="revenue_cents"?(v/100).toFixed(2)+" €":v}</div></div>`).join("")}</div><p>V7 utilise PostgreSQL, JWT, bcrypt et prévoit Stripe Connect/Stripe Payments via variables d'environnement.</p>`}go()</script></body></html>
