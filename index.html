<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secondeo Market V8</title><style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#17231d}header{background:#06351f;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0}.brand{font-size:21px;font-weight:800}.wrap{max-width:1150px;margin:auto;padding:28px 18px}.hero{background:#e4f1ea;border-radius:22px;padding:35px;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card,.box{background:#fff;border:1px solid #dce6df;border-radius:16px;padding:18px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.primary{background:#087f45;color:#fff}.secondary{background:#e9efeb}.price{font-size:22px;font-weight:800;margin:10px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 12px;border:1px solid #ccd8d0;border-radius:8px}.row{display:flex;gap:10px}.row>*{flex:1}.mut{color:#68756e}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.modal .box{width:min(440px,90%)}nav{display:flex;gap:6px;flex-wrap:wrap}</style></head><body>
<header><div class="brand">🛍️ Secondeo Market <small style='opacity:.7'>V8</small></div><nav><button class="btn" onclick="home()">Accueil</button><button class="btn" onclick="cart()">🛒 Panier</button><button class="btn" onclick="orders()">📦 Commandes</button><button class="btn" onclick="favorites()">❤️ Favoris</button><button class="btn" onclick="messages()">💬 Messages</button><button class="btn" onclick="auth()">👤 Compte</button></nav></header><main class="wrap" id="app"></main>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<script>
let token=localStorage.token||"",app=document.querySelector("#app"),modal=document.querySelector("#modal"),box=document.querySelector("#box");
async function api(p,o={}){o.headers={...(o.headers||{}),"Content-Type":"application/json"};if(token)o.headers.Authorization="Bearer "+token;let r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error||"Erreur");return d}
function open(x){box.innerHTML=x;modal.style.display="flex"}function close(){modal.style.display="none"}
function auth(){open(`<h2>Connexion</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Mot de passe"><button class="btn primary" onclick="login()">Se connecter</button><hr><h3>Créer un compte vendeur</h3><input id="nm" placeholder="Nom"><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Mot de passe"><button class="btn secondary" onclick="register()">Créer le compte</button>`)}
async function login(){try{let d=await api("/api/login",{method:"POST",body:JSON.stringify({email:email.value,password:pass.value})});token=d.token;localStorage.token=token;close();home()}catch(e){alert(e.message)}}
async function register(){try{let d=await api("/api/register",{method:"POST",body:JSON.stringify({name:nm.value,email:em.value,password:pw.value,role:"seller"})});token=d.token;localStorage.token=token;close();seller()}catch(e){alert(e.message)}}async function home(){
  app.innerHTML = "<h2>Chargement...</h2>";

  try {
    let ps = await api("/api/products");

    app.innerHTML = `
      <section class="hero">
        <h1>La marketplace française de seconde main</h1>
        <p>Achetez, vendez et donnez une seconde vie à vos objets.</p>

        <div class="row">
          <input id="q" placeholder="Rechercher un produit">
          <button class="btn primary" onclick="search()">Rechercher</button>
        </div>
      </section>

      <div class="grid">
        ${
          ps.length
          ? ps.map(p => `
            <article class="card">
              <div style="font-size:45px">📦</div>
              <h3>${esc(p.title)}</h3>
              <p class="mut">
                ${esc(p.category || "")} · ${esc(p.city || "France")}
              </p>
              <div class="price">
                ${(p.price_cents / 100).toFixed(2)} €
              </div>
              <button class="btn primary" onclick="add(${p.id})">
                Ajouter au panier
              </button>
              <button class="btn secondary" onclick="fav(${p.id})">
                ♡
              </button>
            </article>
          `).join("")
          : `<div class="card">
               <h2>Aucun produit disponible pour le moment</h2>
               <p class="mut">
                 Soyez le premier à publier une annonce.
               </p>
             </div>`
        }
      </div>
    `;
  } catch(e) {
    app.innerHTML = `
      <div class="card">
        <h2>⚠️ Impossible de charger les produits</h2>
        <p>${esc(e.message)}</p>
        <button class="btn primary" onclick="home()">
          Réessayer
        </button>
      </div>
    `;
  }
}
async function search(){let ps=await api("/api/products?q="+encodeURIComponent(q.value));app.innerHTML=`<h2>Résultats</h2><div class="grid">${ps.map(p=>`<article class="card"><h3>${esc(p.title)}</h3><p>${esc(p.description||"")}</p><div class="price">${(p.price_cents/100).toFixed(2)} €</div><button class="btn primary" onclick="add(${p.id})">Ajouter</button></article>`).join("")}</div>`}
async function add(id){if(!token)return auth();await api("/api/cart",{method:"POST",body:JSON.stringify({productId:id})});alert("Article ajouté")}
async function cart(){if(!token)return auth();let a=await api("/api/cart"),t=a.reduce((s,x)=>s+x.price_cents*x.quantity,0);app.innerHTML=`<h2>Mon panier</h2><div class="card">${a.length?a.map(x=>`<p><b>${esc(x.title)}</b> — ${x.quantity} × ${(x.price_cents/100).toFixed(2)} € <button class="btn secondary" onclick="del(${x.product_id})">Supprimer</button></p>`).join("")+`<h3>Total ${(t/100).toFixed(2)} €</h3><button class="btn primary" onclick="checkout()">Commander</button>`:"Panier vide."}</div>`}
async function del(id){await api("/api/cart/"+id,{method:"DELETE"});cart()}
function checkout(){open(`<h2>Livraison France</h2><input id="fn" placeholder="Nom complet"><input id="ad" placeholder="Adresse"><div class="row"><input id="zip" placeholder="Code postal"><input id="city" placeholder="Ville"></div><select id="ship"><option value="4.99">Standard — 4,99 €</option><option value="8.99">Express — 8,99 €</option><option value="0">Remise en main propre — 0 €</option></select><button class="btn primary" onclick="createOrder()">Créer la commande</button>`)}
async function createOrder(){try{let o=await api("/api/checkout",{method:"POST",body:JSON.stringify({fullName:fn.value,address:ad.value,postalCode:zip.value,city:city.value,shipping:ship.value})});close();open(`<h2>Commande #${o.id}</h2><p>Total ${(o.total_cents/100).toFixed(2)} €</p><button class="btn primary" onclick="pay(${o.id})">Payer avec Stripe</button>`)}catch(e){alert(e.message)}}
async function pay(id){try{let d=await api("/api/orders/"+id+"/payment",{method:"POST"});alert("Stripe est prêt : le clientSecret a été créé. Il faut maintenant brancher Stripe.js pour afficher le formulaire de carte.");close();orders()}catch(e){alert(e.message)}}
async function orders(){if(!token)return auth();let a=await api("/api/orders");app.innerHTML=`<h2>Mes commandes</h2>${a.length?a.map(o=>`<div class="card"><b>#${o.id}</b> · ${(o.total_cents/100).toFixed(2)} € · ${o.status} · Livraison: ${o.shipping_status}</div>`).join(""):"Aucune commande."}`}
function seller(){app.innerHTML=`<h2>Espace vendeur</h2><div class="card"><input id="pt" placeholder="Titre"><textarea id="pd" placeholder="Description"></textarea><div class="row"><input id="pp" placeholder="Prix (€)"><input id="pc" placeholder="Catégorie"></div><input id="pv" placeholder="État"><input id="pl" placeholder="Ville"><button class="btn primary" onclick="publish()">Publier l'annonce</button></div>`}
async function publish(){try{await api("/api/products",{method:"POST",body:JSON.stringify({title:pt.value,description:pd.value,price:pp.value,category:pc.value,condition:pv.value,city:pl.value})});alert("Annonce envoyée à la modération");seller()}catch(e){alert(e.message)}}

async function favorites(){if(!token)return auth();let a=await api("/api/favorites");app.innerHTML=`<h2>❤️ Mes favoris</h2><div class="grid">${a.length?a.map(p=>`<div class="card"><h3>${esc(p.title)}</h3><div class="price">${(p.price_cents/100).toFixed(2)} €</div><button class="btn secondary" onclick="unfav(${p.id})">Retirer</button></div>`).join(""):"Aucun favori."}</div>`}
async function fav(id){if(!token)return auth();await api("/api/favorites/"+id,{method:"POST"});alert("Ajouté aux favoris")}
async function unfav(id){await api("/api/favorites/"+id,{method:"DELETE"});favorites()}
async function messages(){if(!token)return auth();let a=await api("/api/conversations");app.innerHTML=`<h2>💬 Messages</h2>${a.length?a.map(c=>`<div class="card"><b>${esc(c.title)}</b><p>${esc(c.buyer_name)} ↔ ${esc(c.seller_name)}</p><button class="btn primary" onclick="thread(${c.id})">Ouvrir</button></div>`).join(""):"Aucune conversation."}`}
async function thread(id){let a=await api("/api/conversations/"+id+"/messages");app.innerHTML=`<h2>Conversation</h2><div class="card">${a.map(m=>`<p><b>${esc(m.sender_name)} :</b> ${esc(m.body)}</p>`).join("")}<textarea id="msg" placeholder="Votre message"></textarea><button class="btn primary" onclick="sendMsg(${id})">Envoyer</button></div>`}
async function sendMsg(id){await api("/api/conversations/"+id+"/messages",{method:"POST",body:JSON.stringify({body:msg.value})});thread(id)}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}home()
</script></body></html>
